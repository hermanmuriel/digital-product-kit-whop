<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Thank you</title>
<style>
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
         color: #111; background: #fafafa; line-height: 1.55; }
  main { max-width: 560px; margin: 0 auto; padding: 96px 24px; text-align: center; }
  h1 { font-size: 36px; margin: 0 0 12px; }
  p { font-size: 18px; color: #444; }
  a.download { display: none; margin-top: 24px; font-size: 18px; font-weight: 600;
               padding: 16px 44px; border-radius: 8px; background: #111; color: #fff;
               text-decoration: none; }
</style>
</head>
<body>
<main>
  <h1>Thank you!</h1>
  <p id="status">Getting your download ready. We have also emailed the link to you.</p>
  <a class="download" id="download" href="#">Download {{TITLE}}</a>
</main>
<script>
(function () {
  var q = new URLSearchParams(location.search);
  var pay = q.get("payment") || q.get("payment_id") || q.get("receipt_id");
  var status = q.get("status");
  var tries = 0;
  if (status === "failed" || status === "canceled") {
    document.querySelector("h1").textContent = "Payment didn't go through";
    document.getElementById("status").innerHTML =
      'You haven\u2019t been charged. <a href="/">Go back and try again</a>.';
    return;
  }
  function check() {
    if (!pay || tries++ > 40) {
      document.getElementById("status").textContent =
        "Your download link is on its way to your inbox. Questions? {{SUPPORT_EMAIL}}";
      return;
    }
    fetch("/order-link?payment=" + encodeURIComponent(pay))
      .then(function (r) { return r.json(); })
      .then(function (d) {
        if (!d.ready) return setTimeout(check, 1500);
        var a = document.getElementById("download");
        a.href = d.url;
        a.style.display = "inline-block";
        document.getElementById("status").textContent =
          "Your files are ready. The link is in your inbox too.";
      })
      .catch(function () { setTimeout(check, 1500); });
  }
  check();
})();
</script>
</body>
</html>
